# Asks every pull request author to sign CLA.md, and blocks the pull
# request until they have.
#
# Signatures are kept in a separate repository, tiaforge/wireserve-cla. This
# repository is a push mirror of the Forgejo server, so a signatures file
# committed here would be overwritten by the next mirror push. Writing to
# that repository needs the CLA_SIGNATURES_TOKEN secret: a fine-grained
# token with Contents read and write on tiaforge/wireserve-cla only.
#
# pull_request_target runs with this repository's secrets, so this workflow
# must never check out or run code from the pull request.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.repository == 'tiaforge/wireserve' && (
        github.event_name == 'pull_request_target' ||
        github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
      )
    runs-on: ubuntu-24.04
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/tiaforge/wireserve/blob/main/CLA.md
          remote-organization-name: tiaforge
          remote-repository-name: wireserve-cla
          path-to-signatures: signatures/v1.json
          branch: main
          allowlist: renovate[bot],dependabot[bot]
