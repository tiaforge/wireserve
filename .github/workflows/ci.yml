# Unit tests and clippy on every branch push and pull request. Tags are
# left to release.yml, which builds and runs the e2e suites instead.
#
# Actions are pinned to commit hashes: this repository is public, and a
# moved tag in someone else's repository should not change what runs here.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # A kernel test that would skip fails instead: everything it needs
      # is set up below, so a skip here means something is missing.
      WIRESERVE_TEST_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The firewall tests run real nft, iptables and wg inside unprivileged
      # network namespaces, which Ubuntu's AppArmor forbids by default. The
      # wireguard module is loaded up front because a namespace's root
      # cannot load modules.
      - name: Kernel test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iptables wireguard-tools
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          sudo modprobe wireguard
          # Loading a 20,000-element set in a namespace needs more socket
          # buffer than Ubuntu's default wmem_max (nft names this value).
          sudo sysctl -w net.core.wmem_max=2097152

      - name: Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo test
        run: cargo test --workspace --locked

      # The service addresses' payload rewrites are refused in a user
      # namespace, so this one test only does its work as real root.
      - name: cargo test (as root, the address rewrites)
        run: |
          bin=$(cargo test -p wireserve-agent --lib --locked --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable')
          sudo WIRESERVE_TEST_STRICT=1 "$bin" --exact \
            firewall::nftables::tests::kernel_a_mapped_service_is_reached_through_the_carry_interface_too --nocapture

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The agent alone: a Windows node runs nothing else. GitHub's Windows
  # runners are elevated, so the wireguard-nt driver test runs for real
  # here (and, under WIRESERVE_TEST_STRICT, may not skip).
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      WIRESERVE_TEST_STRICT: "1"
      # aws-lc's assembly, prebuilt in its own sources, instead of NASM on
      # the runner.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo clippy
        run: cargo clippy -p wireserve-agent --all-targets --locked -- -D warnings

      # The agent loads wireguard.dll from its own directory only, so the
      # tests need it next to their binary. The official release, refused
      # unless it is exactly the archive pinned here and the DLL is signed
      # by WireGuard LLC.
      - name: wireguard-nt
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wireguard-nt.zip"
          Invoke-WebRequest https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip -OutFile $zip
          $sum = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne "dceb30a9bc4be48cce0f74160fc88a585a2c2627366e8f846fc6658f9038dace") { throw "wireguard-nt archive checksum mismatch: $sum" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\wireguard-nt"
          $dll = "$env:RUNNER_TEMP\wireguard-nt\wireguard-nt\bin\amd64\wireguard.dll"
          $sig = Get-AuthenticodeSignature -LiteralPath $dll
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notlike "CN=WireGuard LLC,*") { throw "wireguard.dll is not signed by WireGuard LLC: $($sig.Status)" }
          New-Item -ItemType Directory -Force target\debug\deps | Out-Null
          Copy-Item $dll target\debug\deps\

      - name: cargo test
        run: cargo test -p wireserve-agent --locked
