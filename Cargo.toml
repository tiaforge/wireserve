[workspace]
resolver = "2"
members = [
    "crates/wireserve-types",
    "crates/wireserve-coordinator",
    "crates/wireserve-agent",
    "crates/wireserve-admin",
    "crates/wireserve-tls",
]

[workspace.package]
# Every crate takes this one version; deploy/release.sh sets it.
version = "1.0.0-beta.2"
edition = "2021"
rust-version = "1.91"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
wireserve-types = { path = "crates/wireserve-types" }
wireserve-tls = { path = "crates/wireserve-tls" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
rand = "0.10"
subtle = "2"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "signal", "sync", "fs"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
# Public DNS records for services (PLAN.md M32). Default features: the
# aws-lc-rs provider, the same one reqwest's rustls already brings in.
dns-update = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "blocking"] }
defguard_wireguard_rs = "0.12"
nftables = { version = "0.6", default-features = false }
base64 = "0.23"
# The sign-in's session tokens (PLAN.md M48); already in the tree through
# openidconnect.
ed25519-dalek = "2"
rpassword = "7"
# Pure-Rust, zero transitive dependencies (Nayuki's reference implementation).
# Its last release predates this project, which here means the QR spec is
# frozen and the crate is complete, not that it is unmaintained.
qrcodegen = "1.8"
libc = "0.2"
# The versions defguard_wireguard_rs uses, for our own route handling (see
# wireserve-agent/src/routes.rs); keep in step with it.
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
netlink-sys = "0.9"
