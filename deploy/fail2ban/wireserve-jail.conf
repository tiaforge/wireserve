# Install at /etc/fail2ban/jail.d/wireserve.conf, ON THE PROXY HOST.
#
# maxretry is deliberately generous. The credentials being guessed are
# 256-bit CSPRNG tokens, so this jail is not what stops a break-in -- it
# exists to stop a guessing run from costing bandwidth and log volume
# indefinitely. Banning a legitimate node's whole site over a handful of
# stale-token retries after a revoke would be the worse outcome.

[wireserve]
enabled  = true
filter   = wireserve
port     = http,https
logpath  = /var/log/wireserve/coordinator.log
maxretry = 30
findtime = 10m
bantime  = 1h
