# fail2ban filter for WireServe coordinator failed-auth events.
# Install at /etc/fail2ban/filter.d/wireserve.conf
#
# Matches the structured audit line the coordinator emits on every failed
# authentication. Verify with `fail2ban-regex` before relying on it; see
# the README in this directory about ANSI escapes in tracing output.

[Definition]
failregex = ^.*event="auth_failure".*client_ip="?<HOST>"?(?:\s.*)?$
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S
