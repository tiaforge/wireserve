[package]
name = "wireserve-coordinator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wireserve-types.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
rand.workspace = true
subtle.workspace = true
tokio.workspace = true
axum.workspace = true
futures-util.workspace = true
# The coordinator's allocator. glibc's keeps what a burst of polls freed, an
# arena per thread: 1.24 GB after 20,000 nodes came back at once, against
# 0.33 GB with jemalloc and 0.18 GB with this (peaks 1.28 / 0.42 / 0.27 GB),
# at the same latency. It takes the page size from the kernel when it runs,
# so one aarch64 build serves 4 KiB and 16 KiB kernels alike.
mimalloc.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
clap.workspace = true
libc.workspace = true
dns-update.workspace = true
rpassword.workspace = true
base64.workspace = true
# Device owners (PLAN.md M38): an OpenID Connect client of the operator's
# identity provider, speaking HTTP through the workspace's reqwest rather
# than the one openidconnect would bring, and sealing refresh tokens at
# rest.
openidconnect = { version = "4", default-features = false }
reqwest.workspace = true
chacha20poly1305 = "0.11"
ed25519-dalek.workspace = true

[dev-dependencies]
tempfile = "3"
# Only the integration tests drive the routers directly via
# `tower::ServiceExt::oneshot`; the binary itself never uses tower.
tower.workspace = true
# Runs the shipped fail2ban filter against the coordinator's real log lines.
regex = "1"
# A paused clock, for the poll body's time limit.
tokio = { workspace = true, features = ["test-util"] }
