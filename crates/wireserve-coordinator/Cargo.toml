[package]
name = "wireserve-coordinator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wireserve-types.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
rand.workspace = true
subtle.workspace = true
tokio.workspace = true
axum.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
clap.workspace = true
libc.workspace = true
dns-update.workspace = true
rpassword.workspace = true
base64.workspace = true
# Device owners (PLAN.md M38): an OpenID Connect client of the operator's
# identity provider, speaking HTTP through the workspace's reqwest rather
# than the one openidconnect would bring, and sealing refresh tokens at
# rest.
openidconnect = { version = "4", default-features = false }
reqwest.workspace = true
chacha20poly1305 = "0.10"

[dev-dependencies]
tempfile = "3"
# Only the integration tests drive the routers directly via
# `tower::ServiceExt::oneshot`; the binary itself never uses tower.
tower.workspace = true
# Runs the shipped fail2ban filter against the coordinator's real log lines.
regex = "1"
