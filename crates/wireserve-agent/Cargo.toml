[package]
name = "wireserve-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The package keeps its name (the library, `wireserve_agent`, and every path
# dependency on it); the command people type is just `wireserve`. The systemd
# unit stays `wireserve-agent`: it names the daemon, not the command.
[[bin]]
name = "wireserve"
path = "src/main.rs"

[dependencies]
wireserve-types.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
tokio.workspace = true
reqwest.workspace = true
defguard_wireguard_rs.workspace = true
rpassword.workspace = true
libc.workspace = true
rand.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nftables.workspace = true
netlink-packet-core.workspace = true
netlink-packet-route.workspace = true
netlink-sys.workspace = true

[dev-dependencies]
tempfile = "3"
